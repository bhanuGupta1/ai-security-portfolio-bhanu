[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "adversarial-transport-attack"
version = "1.0.0"
description = "Adversarial attack framework for AI in transport infrastructure — FGSM, PGD, MITRE ATLAS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bhanu Gupta", email = "bhanuguptagarg@gmail.com" }
]
keywords = ["adversarial-ml", "ai-security", "computer-vision", "fgsm", "pgd", "mitre-atlas", "transport"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["torch>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
vision = ["torchvision>=0.15.0"]

[project.urls]
"Homepage" = "https://github.com/bhanuguptagarg/ai-security-portfolio-bhanu"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
